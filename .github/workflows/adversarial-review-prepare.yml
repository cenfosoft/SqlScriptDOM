name: adversarial-review-prepare

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: adversarial-prepare-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.label.name == 'adversarial-review:run' &&
      github.actor == 'allancascante' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: adversarial-review
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build trusted preparation CLI
        run: dotnet build adversarial-review/src/AdversarialReview.Cli/AdversarialReview.Cli.csproj -c Debug -f net8.0
      - name: Prepare advisory evidence report without inference
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run --no-build --project adversarial-review/src/AdversarialReview.Cli -- prepare-review adversarial-review/config/review.json "${{ runner.temp }}/adversarial-preparation"
      - name: Upload trusted preparation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adversarial-preparation-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adversarial-preparation/
          if-no-files-found: warn
